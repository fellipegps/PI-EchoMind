name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-api:
    name: Backend / unit-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echomind-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            echomind-backend/requirements.txt
            echomind-backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit and API tests with coverage
        run: >-
          python -m pytest -m "not integration and not e2e"
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=72

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: echomind-backend/coverage.xml
          retention-days: 7

  frontend-quality-build:
    name: Frontend / quality-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echomind-front
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: echomind-front/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint frontend
        run: corepack pnpm lint

      - name: Type-check frontend
        run: corepack pnpm exec tsc --noEmit

      - name: Build frontend
        run: corepack pnpm build
