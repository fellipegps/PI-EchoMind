AWSTemplateFormatVersion: '2010-09-09'
Description: EchoMind single-node infrastructure - encrypted durable storage, private administration and bounded MVP costs.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: deploy/README.md
        has: Architecture, cost review, operator prerequisites and recovery procedures
    must:
      - Prepare only; deployment requires a non-root operator and a current credit review.
      - No IAM resources in this application stack; fixed service roles come from the separately reviewed access stack.
      - One amd64 backend worker; public ingress is restricted to HTTP and HTTPS.
      - Disk and node replacement require drained uploads and an explicit recovery plan.
Parameters:
  NodeInstanceProfileName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,128}$'
    Description: Fixed instance profile output from the separately reviewed provisioning access stack.
  SnapshotExecutionRoleArn:
    Type: String
    AllowedPattern: '^arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    Description: Fixed DLM execution role output from the provisioning access stack.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Single AZ for the node and its durable EBS disk; must match a reused disk.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Public Canonical Ubuntu 24.04 amd64 AMI parameter; review resolved AMI before execution.
  AlertEmail:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    Description: Owner email for operational and cost notifications; subscription confirmation required.
  MonthlyBudgetUSD:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 100
    Description: Gross account-wide monthly alert budget before promotional credits, not a spending cap.
  DataVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
  ExistingDataVolumeId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^vol-[a-f0-9]{8,17}$'
    Description: Recovery only - detached ext4 disk in the selected AZ; empty creates a new disk.
  CreateAuditTrail:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Disable only when an existing organization/account trail already records management events.
Conditions:
  NewDataVolume: !Equals [!Ref ExistingDataVolumeId, '']
  EnableAuditTrail: !Equals [!Ref CreateAuditTrail, 'true']
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties: {Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc, Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable}
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Direct public Caddy avoids an extra load balancer; administrative access uses SSM.
        must: [Only public TCP 80/443; no SSH or backend publication.]
    Properties:
      GroupDescription: EchoMind public HTTPS and HTTP challenge only
      VpcId: !Ref Vpc
      Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTPS redirect and ACME HTTP challenge}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Public TLS API}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Signed Ubuntu package repositories}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS dependencies and SSM}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 0.0.0.0/0, Description: Supabase PostgreSQL with required SSL}
  NodeNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Metadata:
      com.aws.cloudformation.Context:
        why: An explicitly tagged interface lets IAM reject reuse of unrelated network interfaces.
        must: [Project subnet and security group only; no automatic public IP.]
    Properties:
      SubnetId: !Ref Subnet
      GroupSet: [!Ref WebSecurityGroup]
      Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]
  DataVolume:
    Type: AWS::EC2::Volume
    Condition: NewDataVolume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Docker volumes, certificates and private runtime configuration outlive the OS/node.
        must: [Never format a disk with an existing filesystem; explicit same-AZ reattachment on recovery.]
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      KmsKeyId: alias/aws/ebs
      VolumeType: gp3
      Size: !Ref DataVolumeGiB
      Tags:
        - {Key: Project, Value: !Ref 'AWS::StackName'}
        - {Key: EchoMindBackup, Value: !Ref 'AWS::StackName'}
        - {Key: Name, Value: !Sub '${AWS::StackName}-data'}
  Node:
    Type: AWS::EC2::Instance
    DependsOn: [PublicRoute, SubnetRoute]
    Metadata:
      com.aws.cloudformation.Context:
        why: Small amd64 CPU node matches the measured packaging; standard credits bound burst costs.
        must:
          - IMDSv2 required; hop limit one deliberately keeps host credentials away from bridge containers.
          - CloudFormation completion is not bootstrap readiness; confirm SSM and the bootstrap marker.
          - Install only signature-verified AWS CLI v2; SSM Agent must support ENV_VAR interpolation.
          - Termination protection and the attached retained disk prevent unattended node replacement.
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.small
      IamInstanceProfile: !Ref NodeInstanceProfileName
      DisableApiTermination: true
      CreditSpecification: {CPUCredits: standard}
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1, InstanceMetadataTags: disabled}
      Monitoring: false
      PropagateTagsToVolumeOnCreation: true
      NetworkInterfaces:
        - {DeviceIndex: '0', NetworkInterfaceId: !Ref NodeNetworkInterface}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeType: gp3, VolumeSize: 16, Encrypted: true, KmsKeyId: alias/aws/ebs, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-node'}, {Key: Project, Value: !Ref 'AWS::StackName'}]
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -Eeuo pipefail
              umask 077
              exec > >(tee -a /var/log/echomind-bootstrap.log) 2>&1
              trap 'systemctl stop docker.service docker.socket || true; systemctl mask docker.service docker.socket || true; echo "Bootstrap failed; Docker blocked until repaired."' ERR
              systemctl mask docker.service docker.socket
              VOLUME_ID='${DiskId}'
              VOLUME_SUFFIX=$(printf '%s' "$VOLUME_ID" | tr -d '-')
              DEVICE="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$VOLUME_SUFFIX"
              for attempt in $(seq 1 120); do
                test -b "$DEVICE" && break
                sleep 5
              done
              test -b "$DEVICE"
              # Reject partitioned or unexpected disks; only an entirely blank disk may be formatted.
              test "$(lsblk -nr -o TYPE "$DEVICE" | wc -l)" -eq 1
              FS_TYPE=$(blkid -s TYPE -o value "$DEVICE" || true)
              if test -z "$FS_TYPE"; then
                test '${FreshDisk}' = true
                test -z "$(wipefs --no-act --noheadings --output TYPE "$DEVICE")"
                mkfs.ext4 -L echomind-data "$DEVICE"
              elif test "$FS_TYPE" != ext4; then
                echo 'Unexpected existing filesystem; refusing to format.'
                exit 1
              fi
              DISK_UUID=$(blkid -s UUID -o value "$DEVICE")
              install -d -m 755 /srv/echomind
              grep -q "UUID=$DISK_UUID /srv/echomind " /etc/fstab || printf 'UUID=%s /srv/echomind ext4 defaults,nofail 0 2\n' "$DISK_UUID" >> /etc/fstab
              mount /srv/echomind
              mountpoint -q /srv/echomind
              install -d -m 700 /srv/echomind/private /etc/echomind
              test -z "$(ls -A /etc/echomind)"
              grep -q '^/srv/echomind/private /etc/echomind ' /etc/fstab || printf '%s\n' '/srv/echomind/private /etc/echomind none bind,nofail,x-systemd.requires-mounts-for=/srv/echomind 0 0' >> /etc/fstab
              mount /etc/echomind
              mountpoint -q /etc/echomind
              # Wait for the separate Elastic IP association and internet route.
              for attempt in $(seq 1 60); do
                curl -fsS --connect-timeout 5 https://download.docker.com/linux/ubuntu/gpg -o /tmp/docker.asc && break
                sleep 5
              done
              test -s /tmp/docker.asc
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=3 update
              apt-get -o Acquire::Retries=3 install -y ca-certificates curl git gnupg unzip
              # AWS CLI signing key from the official installation guide; fingerprint pinned below.
              CLI_WORK=$(mktemp -d /tmp/echomind-awscli.XXXXXXXX)
              export GNUPGHOME="$CLI_WORK/gnupg"
              install -d -m 700 "$GNUPGHOME"
              cat > "$CLI_WORK/awscli.asc" <<'AWS_CLI_KEY'
              -----BEGIN PGP PUBLIC KEY BLOCK-----

              mQINBF2Cr7UBEADJZHcgusOJl7ENSyumXh85z0TRV0xJorM2B/JL0kHOyigQluUG
              ZMLhENaG0bYatdrKP+3H91lvK050pXwnO/R7fB/FSTouki4ciIx5OuLlnJZIxSzx
              PqGl0mkxImLNbGWoi6Lto0LYxqHN2iQtzlwTVmq9733zd3XfcXrZ3+LblHAgEt5G
              TfNxEKJ8soPLyWmwDH6HWCnjZ/aIQRBTIQ05uVeEoYxSh6wOai7ss/KveoSNBbYz
