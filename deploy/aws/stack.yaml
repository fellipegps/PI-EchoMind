              AWS_CLI_KEY
              CLI_FINGERPRINT=FB5DB77FD5C118B80511ADA8A6310ACC4672475C
              test "$(gpg --batch --show-keys --with-colons "$CLI_WORK/awscli.asc" | awk -F: '$1 == "fpr" {print $10; exit}')" = "$CLI_FINGERPRINT"
              gpg --batch --import "$CLI_WORK/awscli.asc"
              CLI_VERSION=2.38.0
              CLI_URL="https://awscli.amazonaws.com/awscli-exe-linux-x86_64-$CLI_VERSION.zip"
              curl --proto '=https' -fsS --retry 3 --connect-timeout 10 --max-time 300 "$CLI_URL" -o "$CLI_WORK/awscliv2.zip"
              curl --proto '=https' -fsS --retry 3 --connect-timeout 10 --max-time 120 "$CLI_URL.sig" -o "$CLI_WORK/awscliv2.zip.sig"
              gpg --batch --status-fd 1 --verify "$CLI_WORK/awscliv2.zip.sig" "$CLI_WORK/awscliv2.zip" > "$CLI_WORK/verified.status"
              grep -q "^\[GNUPG:\] VALIDSIG $CLI_FINGERPRINT " "$CLI_WORK/verified.status"
              unzip -q "$CLI_WORK/awscliv2.zip" -d "$CLI_WORK"
              "$CLI_WORK/aws/install" --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin
              /usr/local/bin/aws --version 2>&1 | grep -q "^aws-cli/$CLI_VERSION "
              gpgconf --kill all
              unset GNUPGHOME
              rm -rf -- "$CLI_WORK"
              install -d -m 755 /etc/apt/keyrings
              install -m 644 /tmp/docker.asc /etc/apt/keyrings/docker.asc
              printf '%s\n' 'Types: deb' 'URIs: https://download.docker.com/linux/ubuntu' 'Suites: noble' 'Components: stable' 'Architectures: amd64' 'Signed-By: /etc/apt/keyrings/docker.asc' > /etc/apt/sources.list.d/docker.sources
              apt-get -o Acquire::Retries=3 update
              apt-get -o Acquire::Retries=3 install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              install -d -m 755 /etc/docker /etc/systemd/system/docker.service.d /etc/systemd/system/containerd.service.d
              # Both image layers and named volumes must reside on the durable disk.
              printf '%s\n' '{"data-root":"/srv/echomind/docker","log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}' > /etc/docker/daemon.json
              # Docker 29 uses a separate containerd image store on fresh installations.
              systemctl stop containerd
              containerd config default | sed -E 's|^root[[:space:]]*=.*$|root = "/srv/echomind/containerd"|' > /etc/containerd/config.toml
              grep -qx 'root = "/srv/echomind/containerd"' /etc/containerd/config.toml
              for service in docker containerd; do
                printf '%s\n' '[Unit]' 'RequiresMountsFor=/srv/echomind /etc/echomind' '[Service]' 'ExecStartPre=/usr/bin/mountpoint -q /srv/echomind' 'ExecStartPre=/usr/bin/mountpoint -q /etc/echomind' > "/etc/systemd/system/$service.service.d/echomind-storage.conf"
              done
              systemctl daemon-reload
              systemctl unmask docker.service docker.socket
              systemctl enable --now containerd docker
              COMPOSE_VERSION=$(docker compose version --short | sed 's/^v//')
              dpkg --compare-versions "$COMPOSE_VERSION" ge 2.30.0
              # Use the signed Snap stable channel; never run two agent installations.
              SSM_AGENT=/snap/amazon-ssm-agent/current/amazon-ssm-agent
              test -x "$SSM_AGENT"
              SSM_VERSION=$("$SSM_AGENT" -version | awk '{print $NF}')
              if ! dpkg --compare-versions "$SSM_VERSION" ge 3.3.2746.0; then
                snap refresh amazon-ssm-agent --channel=stable
                SSM_VERSION=$("$SSM_AGENT" -version | awk '{print $NF}')
              fi
              dpkg --compare-versions "$SSM_VERSION" ge 3.3.2746.0
              snap start --enable amazon-ssm-agent
              systemctl is-active --quiet snap.amazon-ssm-agent.amazon-ssm-agent.service
              printf '%s\n' 'Host ready; application images, runtime secrets and database migrations are separate steps.' > /srv/echomind/bootstrap-ready
            - DiskId: !If [NewDataVolume, !Ref DataVolume, !Ref ExistingDataVolumeId]
              FreshDisk: !If [NewDataVolume, 'true', 'false']
  DiskAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref Node
      VolumeId: !If [NewDataVolume, !Ref DataVolume, !Ref ExistingDataVolumeId]
  PublicIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {Domain: vpc, Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]}
  IpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties: {AllocationId: !GetAtt PublicIp.AllocationId, InstanceId: !Ref Node}
  SnapshotPolicy:
    Type: AWS::DLM::LifecyclePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Daily encrypted EBS snapshots protect the complete durable disk without an extra backup agent.
        must: [Crash-consistent only; Supabase backup and a tested restore are separate requirements.]
    Properties:
      Description: EchoMind daily durable disk snapshot
      State: ENABLED
      ExecutionRoleArn: !Ref SnapshotExecutionRoleArn
      Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]
      PolicyDetails:
        PolicyType: EBS_SNAPSHOT_MANAGEMENT
        ResourceTypes: [VOLUME]
        TargetTags: [{Key: EchoMindBackup, Value: !Ref 'AWS::StackName'}]
        Schedules:
          - Name: daily
            CopyTags: true
            TagsToAdd: [{Key: EchoMindBackup, Value: !Ref 'AWS::StackName'}]
            CreateRule: {Interval: 24, IntervalUnit: HOURS, Times: ['03:00']}
            RetainRule: {Count: 7}
  AlertKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: EchoMind operational notification encryption
      Tags: [{Key: Project, Value: !Ref 'AWS::StackName'}]
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - {Sid: AccountAdministration, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}, Action: 'kms:*', Resource: '*'}
          - Sid: CloudWatchNotifications
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: ['kms:Decrypt', 'kms:GenerateDataKey*']
            Resource: '*'
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'}
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-ops'
      KmsMasterKeyId: !Ref AlertKey
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: 'sns:Publish'
            Resource: !Ref AlertTopic
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnLike: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*'}
  StatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-node-status'
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Node}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cpu-high'
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref Node}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
  CreditAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cpu-credits-low'
      Namespace: AWS/EC2
      MetricName: CPUCreditBalance
      Dimensions: [{Name: InstanceId, Value: !Ref Node}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!Ref AlertTopic]
  BackupAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-snapshot-failure'
      Namespace: AWS/EBS
      MetricName: SnapshotsCreateFailed
      Dimensions: [{Name: DLMPolicyId, Value: !Ref SnapshotPolicy}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-gross-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUSD, Unit: USD}
        CostTypes: {IncludeCredit: false, IncludeRefund: false, IncludeTax: true, UseAmortized: false}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref AlertEmail}]
  AuditBucket:
    Type: AWS::S3::Bucket
    Condition: EnableAuditTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - {Id: expiry, Status: Enabled, ExpirationInDays: 90, NoncurrentVersionExpiration: {NoncurrentDays: 30}}
  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableAuditTrail
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt AuditBucket.Arn, !Sub '${AuditBucket.Arn}/*'], Condition: {Bool: {'aws:SecureTransport': false}}}
          - Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt AuditBucket.Arn
            Condition: {StringEquals: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit'}}
          - Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: 's3:PutObject'
            Resource: !Sub '${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit'
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: EnableAuditTrail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: !Sub '${AWS::StackName}-audit'
      S3BucketName: !Ref AuditBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors: [{IncludeManagementEvents: true, ReadWriteType: All}]
Outputs:
  InstanceId: {Description: Host managed through SSM, Value: !Ref Node}
  PublicIpv4: {Description: Set the API DNS A record to this address after bootstrap validation, Value: !Ref PublicIp}
  DurableVolumeId:
    Description: Retained disk; record before any update or recovery.
    Value: !If [NewDataVolume, !Ref DataVolume, !Ref ExistingDataVolumeId]
  SnapshotPolicyId: {Description: Daily snapshot policy to verify after provisioning, Value: !Ref SnapshotPolicy}
  AlertTopicArn: {Description: Operational email subscription must be confirmed, Value: !Ref AlertTopic}
  AuditBucketName: {Condition: EnableAuditTrail, Description: Private retained management event log bucket, Value: !Ref AuditBucket}
