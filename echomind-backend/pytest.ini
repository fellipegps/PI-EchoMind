[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -v --tb=short --color=yes
markers =
    integration: requer PostgreSQL e pgvector reais em infraestrutura descartavel
    e2e: requer o sistema completo e permanece fora dos gates desta fase
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
